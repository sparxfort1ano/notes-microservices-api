services:
  notes:
    build:
      context: ${NOTES_ROOT}
      dockerfile: ./cmd/Dockerfile
    container_name: notes
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DB=${MONGO_INITDB_DB}
      - MONGO_INITDB_HOST=notes-mongodb
      - MONGO_INITDB_PORT=${MONGO_INITDB_PORT:-27017}
      - MONGO_INITDB_SSL_MODE=${MONGO_INITDB_SSL_MODE:-false}
      - MONGO_INITDB_TIMEOUT=${MONGO_INITDB_TIMEOUT:-5s}
      - MONGO_INITDB_COLLECTION=${MONGO_INITDB_COLLECTION:-notes}
      
      - HTTP_ADDR=${HTTP_ADDR:-:8082}
      - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
      - HTTP_READ_TIMEOUT=${HTTP_READ_TIMEOUT}
      - HTTP_WRITE_TIMEOUT=${HTTP_WRITE_TIMEOUT}
      - HTTP_IDLE_TIMEOUT=${HTTP_IDLE_TIMEOUT}
      
      - REDIS_HOST=notes-redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_TTL=${REDIS_TTL:-1h30m}
      - REDIS_TIMEOUT=${REDIS_TIMEOUT:-5s}
      - REDIS_ENABLED=${REDIS_ENABLED:-true}
      
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - LOGGER_FOLDER=/app/out/logs
    ports:
      - "${NOTES_PORT:-8082}:8082"
    depends_on:
      - notes-mongodb
      - notes-redis
    volumes:
      - ${PROJECT_ROOT}/out/logs/notes:/app/out/logs
    restart: unless-stopped

  notes-mongodb:
    container_name: notes-env-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    image: mongo:8.3.11
    volumes:
      - mongodata-notes:/data/db
    restart: unless-stopped

  notes-redis:
    image: redis:8.8.1
    container_name: notes-env-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata-notes:/data
    depends_on:
      - notes-mongodb
    restart: unless-stopped

  notes-port-forward:
    image: alpine/socat:1.8.0.3
    container_name: notes-env-port-forwarder
    entrypoint: | 
        /bin/sh -c "
          socat -d -d tcp-listen:${MONGO_PORT:-27017},fork,reuseaddr tcp-connect:notes-mongodb:27017 &
          socat -d -d tcp-listen:${REDIS_PORT:-6379},fork,reuseaddr tcp-connect:notes-redis:6379 &
          wait
        "
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    depends_on:
      - notes-mongodb
    restart: unless-stopped

volumes:
  mongodata-notes: {}
  redisdata-notes: {}