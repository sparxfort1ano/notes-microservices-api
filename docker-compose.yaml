services:
  auth:
    build:
      context: ${AUTH_ROOT}
      dockerfile: ./cmd/Dockerfile
    container_name: auth
    environment:
      - HTTP_ADDR=${HTTP_ADDR}
      - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
      - HTTP_READ_TIMEOUT=${HTTP_READ_TIMEOUT}
      - HTTP_WRITE_TIMEOUT=${HTTP_WRITE_TIMEOUT}
      - HTTP_IDLE_TIMEOUT=${HTTP_IDLE_TIMEOUT}

      - POSTGRES_HOST=auth-postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_SSL_MODE=${POSTGRES_SSL_MODE}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ACCESS_TOKEN_EXPIRATION=${JWT_ACCESS_TOKEN_EXPIRATION}
      - JWT_REFRESH_TOKEN_EXPIRATION=${JWT_REFRESH_TOKEN_EXPIRATION}
      
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - LOGGER_FOLDER=/app/out/logs
    ports:
      - "${AUTH_PORT}:${AUTH_PORT}"
    depends_on:
      - auth-postgres
    volumes:
      - ${PROJECT_ROOT}/out/logs:/app/out/logs
    restart: unless-stopped

  auth-postgres:
    image: postgres:16-bookworm
    container_name: auth-env-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata-auth:/var/lib/postgresql/data
    restart: unless-stopped

  auth-pgadmin:
    image: dpage/pgadmin4:9.16
    container_name: auth-env-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - auth-postgres
    restart: unless-stopped

  auth-port-forward:
    image: alpine/socat:1.8.0.3
    container_name: auth-env-port-forwarder
    command: tcp-listen:${POSTGRES_PORT:-5432},fork,reuseaddr tcp-connect:auth-postgres:5432
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    depends_on:
      - auth-postgres
    restart: unless-stopped

volumes:
  pgdata-auth: {}
  pgadmin-data: {}