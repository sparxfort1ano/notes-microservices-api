services:
  nginx:
    image: nginx:1.25.4-alpine
    container_name: api-gateway
    ports:
      - "80:80"
    volumes:
      - ${PROJECT_ROOT}/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - microservices-net
    restart: unless-stopped

networks:
  microservices-net:
    external: true